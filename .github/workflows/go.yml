name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # TODO: pkg/provider/browser is excluded for now. Its tests download the Playwright
      # driver (v1.47.2) from playwright*.azureedge.net, which Microsoft has retired, so every
      # download returns 404. Re-enable once playwright-go is upgraded to a release that
      # fetches the driver from npm (the module moved to github.com/mxschmitt/playwright-go).
      #
      # On macOS, Go 1.22 test binaries lack the LC_UUID load command and current macOS
      # refuses to load them; the external linker adds it.
      - name: Test
        run: |
          LDFLAGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then LDFLAGS="-ldflags=-linkmode=external"; fi
          go test -v $LDFLAGS -coverprofile=${{ matrix.os }}_coverage.txt -covermode=atomic $(go list ./... | grep -v /pkg/provider/browser)

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_reports
          path: ${{ matrix.os }}_coverage.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install
        run: go install ./cmd/saml2aws

  linting:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          args: --timeout=2m

  coverage:
    name: coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest_reports
          path: reports

      - uses: actions/download-artifact@v4
        with:
          name: macOS-latest_reports
          path: reports

      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: reports
          flags: unittests

  release-build:
    name: release-build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install dependency required for linux builds
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean --config .goreleaser.${{ matrix.os }}.yml

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_saml2aws
          path: dist/
